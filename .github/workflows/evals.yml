# Chapter 14: the live eval suite. It costs money, so it runs weekly,
# on demand, and on pull requests labelled "run-evals".
name: evals
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled]
jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m evals.run --trials 3 --gate
